[advisories]
ignore = [
    # matrix-sdk 0.19.1 requires anymap2; advisory is maintenance status, not a vulnerability.
    # Remove this exception when the next SDK release uses anymap3 (already on upstream main).
    { id = "RUSTSEC-2026-0319", reason = "Official SDK dependency; no compatible upgrade available" },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "MPL-2.0", "0BSD", "CC0-1.0", "Unlicense",
    "CDLA-Permissive-2.0", "BSL-1.0",
]

[bans]
# Official SDK dependencies require concurrent major versions of several shared crates.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
