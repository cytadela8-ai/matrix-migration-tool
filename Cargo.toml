[package]
name = "matrix-migration-tool"
version = "0.1.0"
edition = "2024"
description = "Idempotent Matrix account migration with verified encrypted history"
license = "MIT"
repository = "https://github.com/cytadela8-ai/matrix-migration-tool"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
matrix-sdk-crypto = "=0.19.1"
serde = { version = "=1.0.229", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tracing = "=0.1.44"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
zeroize = "=1.9.1"

[dependencies.matrix-sdk]
version = "=0.19.1"
default-features = false
features = [
    "e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite", "rustls-aws-lc-rs",
]

[dependencies.tokio]
version = "=1.53.2"
features = ["rt-multi-thread", "macros", "time", "io-util", "io-std", "signal", "net", "process"]

[profile.dev]
debug = 0

[profile.test]
debug = 0

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
too_many_lines = "deny"
